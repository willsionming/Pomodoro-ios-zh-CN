name: Build Unsigned IPA
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and archive（不签名）
        run: |
          xcodebuild archive \
            -project PomodoroTimer.xcodeproj \
            -scheme PomodoroTimer \
            -configuration Release \
            -archivePath build/archive.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: 打包成【未签名IPA】
        run: |
          mkdir -p Payload
          cp -r build/archive.xcarchive/Products/Applications/PomodoroTimer.app Payload/
          zip -r PomodoroTimer_unsigned.ipa Payload
          rm -rf Payload

      - name: 上传未签名IPA
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroTimer_unsigned
          path: PomodoroTimer_unsigned.ipa
